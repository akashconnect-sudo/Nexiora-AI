services:
  postgres:
    image: postgres:16-alpine
    container_name: nexiora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexiora
      POSTGRES_PASSWORD: nexiora
      POSTGRES_DB: nexiora
    ports:
      - "5432:5432"
    volumes:
      - nexiora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexiora -d nexiora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexiora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexiora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: nexiora-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - nexiora_opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: nexiora-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - nexiora_qdrant:/qdrant/storage

volumes:
  nexiora_pg:
  nexiora_redis:
  nexiora_opensearch:
  nexiora_qdrant:
