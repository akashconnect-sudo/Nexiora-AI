services:
  redis:
    image: redis:7-alpine
    container_name: nexiora-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - '6379:6379'
    volumes:
      - nexiora_redis:/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: nexiora-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      bootstrap.memory_lock: 'true'
    ports:
      - '9200:9200'
    volumes:
      - nexiora_opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1280m
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: nexiora-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - nexiora_qdrant:/qdrant/storage
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"']
      interval: 15s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: nexiora-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./deploy/vps/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318'
    mem_limit: 192m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexiora-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SEARCH_EXECUTION_MODE: queue
      SEARCH_INDEX_READ_MODE: ${SEARCH_INDEX_READ_MODE:-off}
      SEARCH_INDEX_WRITE_ENABLED: ${SEARCH_INDEX_WRITE_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      OPENSEARCH_NODE: http://opensearch:9200
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      WORKER_CONCURRENCY: 2
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    mem_limit: 768m

volumes:
  nexiora_redis:
  nexiora_opensearch:
  nexiora_qdrant:
